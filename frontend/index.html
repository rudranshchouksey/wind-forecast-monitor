<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GB Wind Forecast Monitor</title>
    <meta
      name="description"
      content="Day-ahead accuracy of the GB national wind forecast (Elexon WINDFOR vs FUELHH)."
    />
    <meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://wind-forecast-monitor-wine.vercel.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GB Wind Forecast Monitor" />
    <meta property="og:title" content="GB Wind Forecast Monitor" />
    <meta
      property="og:description"
      content="Day-ahead accuracy of the GB national wind forecast (Elexon WINDFOR vs FUELHH)."
    />
    <meta property="og:url" content="https://wind-forecast-monitor-wine.vercel.app/" />
    <meta property="og:image" content="https://wind-forecast-monitor-wine.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="GB Wind Forecast Monitor: the suggested day-ahead wind buffer and forecast accuracy"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GB Wind Forecast Monitor" />
    <meta
      name="twitter:description"
      content="Day-ahead accuracy of the GB national wind forecast (Elexon WINDFOR vs FUELHH)."
    />
    <meta name="twitter:image" content="https://wind-forecast-monitor-wine.vercel.app/og.png" />

    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <noscript>This dashboard needs JavaScript. The API is documented at /api/v1/docs.</noscript>
    <div id="root">
      <!-- Static first paint (mirrors AppHeader + DashboardSkeleton); React replaces it. -->
      <div class="relative isolate flex min-h-dvh flex-col">
        <header class="sticky top-0 z-40 border-b border-line bg-bg/80">
          <div class="mx-auto flex h-13 max-w-[1440px] items-center gap-3 px-4 sm:px-6 lg:px-8">
            <div class="flex min-w-0 items-center gap-2.5">
              <svg viewBox="0 0 32 32" aria-hidden="true" class="h-7 w-7">
                <rect width="32" height="32" rx="8" fill="var(--accent)" />
                <g stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round">
                  <path d="M16 16V6.5M16 16l8.2 4.7M16 16l-8.2 4.7" />
                </g>
                <circle cx="16" cy="16" r="2.4" fill="var(--accent-ink)" />
              </svg>
              <span class="truncate text-heading font-semibold tracking-[-0.01em] text-ink"
                >GB Wind Forecast Monitor</span
              >
            </div>
          </div>
        </header>
        <div class="h-[49px] border-b border-line lg:hidden"></div>
        <div class="mx-auto w-full max-w-[1440px] px-4 pt-6 max-lg:hidden sm:px-6 lg:px-8">
          <div class="h-[178px] rounded-card border border-line bg-panel/80"></div>
        </div>
        <div class="mx-auto w-full max-w-[1440px] space-y-6 px-4 pt-6 sm:space-y-8 sm:px-6 lg:px-8">
          <p class="max-w-3xl text-body text-ink-2">
            How far the day-ahead national wind forecast missed actual output, and what that means
            for purchasing
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

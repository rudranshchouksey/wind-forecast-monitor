name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check (strict)
        run: uv run mypy
      - name: Tests (services coverage >= 85%)
        run: |
          uv run pytest --cov=app --cov-report=term --cov-report=xml
          uv run coverage report --include="app/services/*" --fail-under=85
      - name: requirements.txt matches uv.lock (used by Vercel)
        run: |
          uv export --no-dev --no-hashes --no-emit-project --quiet -o /tmp/req.txt
          diff <(grep -v '^#' /tmp/req.txt) <(grep -v '^#' ../requirements.txt)

  frontend:
    name: Frontend (eslint, prettier, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: wind-forecast-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 wind-forecast-monitor:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/v1/health && break; sleep 1; done
          bash scripts/smoke.sh http://localhost:8000
          docker inspect --format '{{.Config.User}}' app | grep -q app
      - if: always()
        run: docker logs app || true

  dev:
    name: Fresh-clone dev setup (make install + make dev)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - name: make dev, then hit every endpoint through the Vite proxy
        run: |
          make dev > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS localhost:5173/api/v1/health > /dev/null && break; sleep 1; done
          bash scripts/smoke.sh http://localhost:5173
      - if: always()
        run: cat dev.log || true

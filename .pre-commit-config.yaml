# pip/uv: `uvx pre-commit install`. Hooks reuse the project toolchains (uv + npm),
# so versions always match CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (strict)
        entry: uv run --directory backend mypy
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: tsc
        name: tsc --noEmit
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: no-large-files
        name: block files > 5 MB
        entry: python -c "import os,sys; big=[f for f in sys.argv[1:] if os.path.getsize(f) > 5_000_000]; print(*big); sys.exit(bool(big))"
        language: system
